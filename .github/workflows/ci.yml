name: ci
on:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: make -j4 cozy
      - name: diag
        run: python3 tools/diag_sigint.py
      - name: diag linux-style test
        run: timeout 300 python3 tests/run_lineedit.py || true
